  (Windows Management Instrumentation, MITRE T1047). Reference: https://lolbas-project.github.io/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - \wmic.exe
    CommandLine|re:
      - (?i)(process\s+call\s+create|/node\s*:)

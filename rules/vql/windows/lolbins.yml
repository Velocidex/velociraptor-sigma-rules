  JScript/VBScript (Visual Basic, MITRE T1059.005). Reference: https://lolbas-project.github.io/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - \cscript.exe
      - \wscript.exe
    CommandLine|re:
      - (?i)(\\(temp|tmp|appdata|public)\S*\.(js|vbs|wsf|jse|vbe)\b|https?://\S*\.(js|vbs|wsf)\b)
  condition: selection
level: medium
details: Detected suspicious LOLBin invocation %EventData.CommandLine%

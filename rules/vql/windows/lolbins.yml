title: LOLBin Regsvr32 Silent COM Scriptlet Execution
description: |
  Regsvr32 silently executing a COM scriptlet (/s /u /i: or /i:https://...).
  Adversaries abuse regsvr32.exe to bypass application control and proxy execution
  (System Binary Proxy Execution, MITRE T1218.010). Reference: https://lolbas-project.github.io/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - \regsvr32.exe
    CommandLine|re:
      - (?i)(/s\s+/u\s+/i:|/i\s*:\s*https?://)
  condition: selection
level: high
details: Detected suspicious LOLBin invocation %EventData.CommandLine%
enrichment: |
  x=>dict(
    CallChain=GetCallChain(Pid=x.EventData.Pid),

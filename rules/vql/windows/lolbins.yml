title: LOLBin MSHTA Remote Script Execution
description: |
  MSHTA loading remote or script content (https, javascript:, vbscript:, .hta).
  Adversaries abuse mshta.exe to proxy execution of malicious scripts and HTA files
  (System Binary Proxy Execution, MITRE T1218.005). Reference: https://lolbas-project.github.io/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - \mshta.exe
    CommandLine|re:
      - (?i)(https?://|javascript:|vbscript:|\.hta\b)
  condition: selection
level: high
details: Detected suspicious LOLBin invocation %EventData.CommandLine%
enrichment: |
  x=>dict(
    CallChain=GetCallChain(Pid=x.EventData.Pid),
    ImageHash=x.EventData.Image && hash(path=x.EventData.Image),
    ParentHash=x.EventData.ParentImage && hash(path=x.EventData.ParentImage))
---

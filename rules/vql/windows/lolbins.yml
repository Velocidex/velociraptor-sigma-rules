  download and execute remote MSI packages (System Binary Proxy Execution,
  MITRE T1218.007). This also occurs in legitimate software deployment, so
  results need review. Reference: https://lolbas-project.github.io/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - \msiexec.exe
    CommandLine|re:
      - (?i)/[iq]\s+https?://
  condition: selection
level: medium
details: Detected suspicious LOLBin invocation %EventData.CommandLine%
enrichment: |
  x=>dict(
    CallChain=GetCallChain(Pid=x.EventData.Pid),
    ImageHash=x.EventData.Image && hash(path=x.EventData.Image),
    ParentHash=x.EventData.ParentImage && hash(path=x.EventData.ParentImage))

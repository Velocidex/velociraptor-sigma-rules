title: LOLBin PowerShell Encoded Invocation
description: |
  PowerShell launched with encoded or obfuscated invocation (encoded command,
  FromBase64String, IEX, DownloadString, bypass). Adversaries abuse powershell.exe
  to execute malicious scripts while evading detection (PowerShell, MITRE T1059.001).
  Encoded invocations also occur in administration, so results need review.
  Reference: https://lolbas-project.github.io/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - \powershell.exe
    CommandLine|re:
      - (?i)(-(e|ec|en|enc)\s|frombase64string|\biex\b\s*\(|downloadstring|bypass)
  condition: selection
level: medium
details: Detected suspicious LOLBin invocation %EventData.CommandLine%
enrichment: |
  x=>dict(
    CallChain=GetCallChain(Pid=x.EventData.Pid),
    ImageHash=x.EventData.Image && hash(path=x.EventData.Image),
    ParentHash=x.EventData.ParentImage && hash(path=x.EventData.ParentImage))

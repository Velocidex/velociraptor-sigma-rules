# This tests the correlation engine.
# The following rule detects many non existent users.

# title: User Guessing
# id: 0ae09af3-f30f-47c2-a31c-83e0b918eeee
# related:
#     - id: 4574194d-e7ca-4356-a95c-21b753a1787e
#       type: obsolete
# status: test
# description: Search for many 4625 failed logon attempts due to wrong usernames in a short period of time.
# references: https://attack.mitre.org/techniques/T1110/003/
# author: Zach Mathis
# date: 2024-10-13
# modified: 2024-10-13
# tags:
#     - attack.t1110.003
#     - attack.credential-access
# correlation:
#     type: value_count
#     rules:
#         - non_existent_user
#     group-by:
#         - IpAddress
#         - LogonType
#         - TargetDomainName
#         - ProcessName
#         - LogonProcessName
#         - WorkstationName
#     timespan: 5m
#     condition:
#         gt: 3
#         field: TargetUserName
# falsepositives:
#     - User mistyping username
# level: medium
# ruletype: Hayabusa
Parameters:
  LogFile: "/test_files/WindowsEvents/non_existent_user.json"
  SubRule: |
    title: Failed Logon - Non-Existent User
    name: non_existent_user
    logsource:
      product: windows
      service: security
    detection:
      condition: (selection and not filter)
      filter:
        IpAddress: '-'
      selection:
        Channel: Security
        EventID: 4625
        SubStatus:
          - "3221225572"
          - "0xc0000064"

    ---

    title: User Guessing
    correlation:
      type: value_count
      group-by:
        - IpAddress
        - LogonType
        - TargetDomainName
        - ProcessName
        - LogonProcessName
        - WorkstationName
      rules:
        - non_existent_user
      timespan: 5m
      condition:
        field: TargetUserName
        gt: 3

Queries:
  - |
    LET _ <= import(artifact="Windows.Hayabusa.Monitoring")
  - |
    SELECT *
    FROM Artifact.Windows.Sigma.Events.ReplayTestSet(
      JSONDump=testDir + LogFile,
      SigmaRules=Rules)
    WHERE Title =~ "User Guessing"
